<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O casamento de Betriz &amp; Luca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Raleway:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root {
    /* sampled from the Lottie export so the heart fill blends into the page */
    --bg: #a3bcdf;
    --ink: #1b324c;
    --ink-dark: #16283f;
    --muted: rgba(27, 50, 76, 0.72);
    --border: rgba(27, 50, 76, 0.55);
    /* All three stacks are Google webfonts, so the page renders identically for
       every guest. Playfair Display carries its own italic, so the two serif
       vars share a stack and the rules below switch with font-style. Its wght
       axis is 400-900 -- nothing lighter than 400 is available. */
    --serif: 'Playfair Display', Georgia, serif;
    --serif-italic: 'Playfair Display', Georgia, serif;
    --script: 'Caveat', cursive;
    --sans: 'Raleway', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 1440px;
    margin: 0 auto;
    padding: clamp(20px, 4vh, 40px) 64px clamp(22px, 5vh, 56px);
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  /* Desktop locks to exactly one viewport, no scroll. Every size below is
     clamped against vh as well as vw so the content shrinks to fit instead
     of overflowing on short screens. */
  @media (min-width: 901px) {
    html, body { height: 100%; overflow: hidden; }
    .page {
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
    }
  }


  /* Header */
  .site-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }

  .logo {
    display: block;
    height: clamp(40px, 6.4vh, 58px);
    width: auto;
    color: #354d68; /* monogram fill, as authored in logo.svg */
  }

  .countdown {
    font-family: var(--serif);
    /* spec: 17.57px / weight 175, but Playfair Display starts at 400 */
    font-size: clamp(13px, 1.85vh, 17.57px);
    font-weight: 400;
    line-height: normal;
    color: var(--ink);
    white-space: nowrap;
    padding-top: 10px;
  }

  /* Hero */
  .hero {
    display: grid;
    /* left fills; right is a fixed 500px track so its edge lands flush with
       the page gutter. Below ~1250px it goes proportional so the title has
       room to breathe instead of being crushed by a rigid 500px. */
    grid-template-columns: minmax(0, 1fr) min(500px, 40%);
    gap: 40px;
    margin-top: clamp(14px, 4vh, 40px);
    flex: 1 1 auto; /* fill remaining viewport height below the header */
  }

  .hero-left {
    display: flex;
    flex-direction: column;
  }

  /* spec: 97px / 93% / -5.82px across every span. Tracking is in em (-5.82/97)
     so it stays proportional as the size clamps down. */
  .title {
    margin: 0;
    font-weight: 400;
    line-height: 0.93;
  }

  .title .line {
    display: block;
    /* the four breaks are authored, not reflowed, so the title reads the same
       at every width -- which means the type has to be sized to fit instead */
    white-space: nowrap;
    /* vw has to assume the narrowest desktop column, so it leaves the type
       undersized on wide screens; the cqw rule below measures the column
       itself and is what actually runs on current browsers. */
    font-size: clamp(28px, min(9.5vw, 8vh), 97px);
    letter-spacing: -0.06em;
  }

  @supports (font-size: 1cqw) {
    .hero-left { container-type: inline-size; }

    /* "de lar, Case." is the widest line at 4.743x its font-size, so 100/4.743
       = 21.1cqw fills the column; 20.2 keeps ~4% against font rounding.
       With four lines the height binds first on desktop: measured across
       650-1080px viewports the title can take at most ~8.3vh before it pushes
       the illustration past the locked viewport, so 8vh is the real cap. */
    .title .line,
    .title .line-script { font-size: min(20.2cqw, 8vh, 97px); }
  }

  /* the italic words inside a line ("companhia", "lar") */
  .title .ital {
    font-style: italic;
    font-weight: 400;
  }

  .title .line strong,
  .title .line-script strong {
    font-weight: 700;
  }

  /* --- hooks for the previous title, kept for the fallback above --- */
  .title .line-script {
    display: block;
    font-family: var(--serif-italic);
    font-style: italic;
    font-weight: 400;
    font-size: clamp(32px, min(5vw, 13vh), 97px);
    letter-spacing: -0.06em;
  }

  .title .light {
    font-weight: 400;
  }

  .title .amp {
    font-family: var(--serif-italic);
    font-style: italic;
    font-weight: 400;
  }

  .illustration {
    /* auto pushes the art to the bottom of the column; the padding keeps a
       minimum breathing gap from the title on short viewports */
    margin-top: auto;
    padding-top: clamp(16px, 4vh, 40px);
    width: 100%;
    /* art is 244.92x342.64 (h = w x 1.4), so cap width by vh to bound height */
    max-width: min(260px, 26vh);
  }

  .illustration svg,
  .illustration > * {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Right column */
  .hero-right {
    display: flex;
    flex-direction: column;
    /* bottom-aligned so the last detail block lands level with the artwork
       across the hero, instead of floating at a vertical centre of its own */
    justify-content: flex-end;
    align-items: center;
    padding-top: 24px;
    width: 100%;
    max-width: 500px;
  }

  .description {
    max-width: 100%;
    /* small body copy, as in the states where venue details are visible */
    font-family: var(--sans);
    font-size: clamp(12px, 1.6vh, 15px);
    line-height: 1.45;
    margin: 0 0 clamp(12px, 2.6vh, 24px);
  }

  /* Tabs */
  .tabs {
    position: relative;
    display: inline-flex;
    border: 1.5px solid var(--border);
    border-radius: 999px;
    padding: 6px;
    max-width: 500px;
    width: 100%;
  }

  .tab-indicator {
    position: absolute;
    top: 6px;
    bottom: 6px;
    left: 6px;
    width: calc(50% - 6px);
    background: var(--ink-dark);
    border-radius: 999px;
    transition: transform 0.35s cubic-bezier(.65,0,.35,1);
  }

  .tabs[data-active="cerimonia"] .tab-indicator {
    transform: translateX(100%);
  }

  .tab {
    position: relative;
    z-index: 1;
    flex: 1;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: clamp(8px, 1.6vh, 14px) 20px;
    font-family: var(--script);
    font-weight: 400;
    font-size: clamp(18px, 2.84vh, 27px);
    line-height: normal;
    color: var(--ink-dark);
    transition: color 0.35s ease;
    text-align: center;
  }

  .tab span {
    display: inline-block;
    transform: rotate(-8deg);
  }

  .tabs[data-active="recepcao"] .tab[data-tab="recepcao"],
  .tabs[data-active="cerimonia"] .tab[data-tab="cerimonia"] {
    color: #fff;
  }

  /* Details */
  .details {
    margin-top: clamp(16px, 4vh, 36px);
    display: flex;
    flex-direction: column;
    gap: clamp(14px, 3.6vh, 32px);
  }

  .detail-row {
    display: grid;
    /* auto (not a fixed track) so the label hugs its text and the gap to the
       heading is a true, constant 20px in both rows */
    grid-template-columns: auto 1fr;
    gap: 20px;
  }

  .detail-row .label {
    font-family: var(--serif-italic);
    font-style: italic;
    font-weight: 400;
    /* spec: 26px / 99% / -1.82px. Tracking is in em so it keeps tracking the
       clamped size instead of over-tightening the small end. */
    font-size: clamp(16px, 2.74vh, 26px);
    line-height: 0.99;
    letter-spacing: -0.07em;
    padding-top: 4px;
  }

  .detail-row h2 {
    margin: 0 0 clamp(4px, 1vh, 8px);
    /* spec: 50px / weight 400 / 89% / -4px */
    font-size: clamp(22px, min(3.47vw, 5.26vh), 50px);
    font-weight: 400;
    line-height: 0.89;
    letter-spacing: -0.08em;
  }

  .detail-row p.address {
    font-family: var(--sans);
    margin: 0 0 clamp(8px, 1.8vh, 16px);
    font-size: clamp(12px, 1.7vh, 15px);
    color: var(--muted);
    line-height: 1.4;
    max-width: 320px;
  }

  .detail-row p.time {
    font-family: var(--sans);
    margin: 0 0 clamp(8px, 1.8vh, 16px);
    font-size: clamp(13px, 1.8vh, 16px);
    color: var(--ink);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border-radius: 999px;
    padding: clamp(8px, 1.4vh, 12px) 22px;
    font-family: var(--serif);
    font-weight: 700;
    /* spec: 20.72px; scaled by vh so it still fits the locked viewport */
    font-size: clamp(14px, 2.18vh, 20.72px);
    line-height: normal;
    text-decoration: none;
    cursor: pointer;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .btn:hover { opacity: 0.85; }
  .btn:active { transform: scale(0.97); }

  /* Sized in em so the icons track the button's clamped font-size. Strokes are
     non-scaling so the hairline stays 1px instead of thinning out on mobile. */
  .btn-icon {
    flex: none;
    height: 0.8em;
    width: auto;
    stroke-width: 1;
  }

  /* the calendar mark is 16x20, so it needs more height to read the same
     optical size as the 16x16 arrow */
  .btn-icon--calendar { height: 0.95em; }

  .btn-outline {
    background: transparent;
    color: var(--ink-dark);
    border: 1.5px solid var(--border);
  }

  /* filled variant -- text and icon drop to the page blue, which is the
     #A3BCDF the button spec calls for */
  .btn-solid {
    background: var(--ink-dark);
    color: var(--bg);
    border: 1.5px solid var(--ink-dark);
  }

  .hero-cta {
    /* hug the label instead of stretching to the flex column's full width */
    align-self: flex-start;
    margin-top: clamp(18px, 3.2vh, 32px);
  }

  .fade-swap {
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Short desktop screens: the 3-line venue name ("Igreja de / Nossa Senhora /
     de Lourdes") is the tallest state and would clip. Tighten only here so the
     50px heading spec still holds at the 950px design height. */
  @media (min-width: 901px) and (max-height: 820px) {
    .detail-row h2 { font-size: clamp(20px, min(3.47vw, 4.55vh), 50px); }
    .details {
      gap: clamp(12px, 2.9vh, 32px);
      margin-top: clamp(12px, 3.1vh, 36px);
    }
  }

  /* Playful asymmetry from the design: "Onde" sits against the left edge of
     the column, "Quando" is pushed over to the right. Desktop only - stacked
     mobile keeps everything left so it doesn't read as accidental. */
  @media (min-width: 901px) {
    .detail-row--when {
      grid-template-columns: auto auto;
      justify-content: end;
      text-align: right;
    }
    .detail-row--when .label { text-align: right; }
    .detail-row--when .value { text-align: left; }
  }

  /* ---- Film grain -------------------------------------------------------
     A tiled feTurbulence noise plate, oversized and nudged in discrete steps
     so it "boils" like projected film rather than sliding smoothly. */
  .grain {
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    z-index: 9999;
    pointer-events: none;
    /* multiply, not overlay: the page blue is light, and overlay resolves to
       screen against a light backdrop, which washes the grain out completely.
       feComponentTransfer flattens the turbulence alpha to opaque and stretches
       the greys around a near-white mean, so the specks read as grain without
       multiply dimming the whole page. */
    opacity: 0.4;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml,<svg%20xmlns='http://www.w3.org/2000/svg'%20width='240'%20height='240'><filter%20id='n'><feTurbulence%20type='fractalNoise'%20baseFrequency='0.75'%20numOctaves='4'%20stitchTiles='stitch'/><feColorMatrix%20type='saturate'%20values='0'/><feComponentTransfer><feFuncR%20type='linear'%20slope='1.25'%20intercept='0.105'/><feFuncG%20type='linear'%20slope='1.25'%20intercept='0.105'/><feFuncB%20type='linear'%20slope='1.25'%20intercept='0.105'/><feFuncA%20type='linear'%20slope='0'%20intercept='1'/></feComponentTransfer></filter><rect%20width='240'%20height='240'%20filter='url%28%23n%29'/></svg>");
    background-repeat: repeat;
    animation: grain 0.8s steps(1, end) infinite;
    will-change: transform;
  }

  @keyframes grain {
    0%   { transform: translate(0, 0); }
    10%  { transform: translate(-2%, -3%); }
    20%  { transform: translate(-4%, 2%); }
    30%  { transform: translate(2%, -4%); }
    40%  { transform: translate(-1%, 3%); }
    50%  { transform: translate(-3%, 1%); }
    60%  { transform: translate(3%, 2%); }
    70%  { transform: translate(-2%, -2%); }
    80%  { transform: translate(1%, -3%); }
    90%  { transform: translate(-4%, -1%); }
    100% { transform: translate(0, 0); }
  }

  /* subtle projector-style luminance flicker */
  .grain::after {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--ink);
    opacity: 0.04;
    animation: flicker 3.4s steps(1, end) infinite;
  }

  @keyframes flicker {
    0%, 100% { opacity: 0.030; }
    25%      { opacity: 0.055; }
    50%      { opacity: 0.020; }
    75%      { opacity: 0.045; }
  }

  @media (prefers-reduced-motion: reduce) {
    .grain { animation: none; }
    .grain::after { animation: none; }
  }

  /* Responsive ------------------------------------------------------------
     The desktop sizes are clamped against vh so they fit a locked viewport.
     On a short phone screen those vh terms collapse to the minimums and the
     type ends up tiny, so mobile re-states everything in vw/px instead. */
  @media (max-width: 900px) {
    .page { padding: 24px 20px 56px; }
    /* stacked: the hero no longer needs to fill the viewport, so the
       bottom-pinned art reverts to normal flow spacing */
    .hero { grid-template-columns: 1fr; gap: 8px; flex: 0 0 auto; }
    .hero-right { padding-top: 40px; justify-content: flex-start; max-width: 100%; }

    /* stacked and scrollable, so the vh cap no longer applies -- width alone
       decides how big the four authored lines can be */
    .title .line,
    .title .line-script { font-size: min(17.8vw, 97px); }
    @supports (font-size: 1cqw) {
      .title .line,
      .title .line-script { font-size: min(20.2cqw, 97px); }
    }

    .illustration { max-width: 240px; margin: 28px auto 0; padding-top: 0; }
    .countdown { font-size: clamp(12px, 3.6vw, 17.57px); padding-top: 14px; }
    .tabs { max-width: 100%; }

    .description {
      max-width: 100%;
      font-size: clamp(15px, 4.2vw, 19px);
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .tab { font-size: clamp(22px, 6.2vw, 28px); padding: 14px 12px; }
    .details { margin-top: 32px; gap: 30px; }
    .detail-row { grid-template-columns: auto 1fr; gap: 20px; }
    .detail-row .label { font-size: clamp(20px, 5.6vw, 26px); }
    .detail-row h2 { font-size: clamp(30px, 8.4vw, 44px); }
    .detail-row p.address { font-size: clamp(14px, 3.7vw, 16px); }
    .detail-row p.time { font-size: clamp(15px, 4vw, 17px); }
    .btn { font-size: clamp(16px, 4.7vw, 20.72px); padding: 12px 22px; }
  }

  @media (max-width: 520px) {
    .site-header { align-items: center; }
    .logo { height: 42px; }
    .illustration { max-width: 215px; }
    .detail-row { grid-template-columns: 1fr; gap: 2px; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie_light.min.js"></script>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<div class="page">

  <header class="site-header">
    <svg class="logo" viewBox="0 0 48 60" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Betriz e Luca">

      <path d="M19.71 37.76C19.41 37.48 18.66 36.81 18.06 36.02C18 35.93 17.88 35.91 17.79 35.97C15.77 37.26 13.39 38.01 11.09 38.01C8.16 38.01 3.46 35.95 2.93 32.78C2.83 32.06 2.4 31.63 1.68 31.63C0.77 31.63 0 32.54 0 33.41C0 34.03 0.29 34.61 0.58 35.09C3.08 38.79 6.67 40.8 11.14 40.8C14.16 40.8 17.17 39.79 19.67 38.09C19.86 37.94 19.77 37.83 19.71 37.77V37.76Z" fill="currentColor"/>
    </svg>
    <div class="countdown" id="countdown">-- Dias, --h, --m --s</div>
  </header>

  <main class="hero">
    <div class="hero-left">
      <!-- Previous title, kept here so we can fall back to it. To revert, swap
           this block with the <h1> below; its CSS hooks (.line-script, .light,
           .amp) are still in the stylesheet.
      <h1 class="title">
        <span class="line-script">O casamento</span>
        <span class="line"><span class="light">de</span> <strong>Betriz</strong></span>
        <span class="line"><span class="amp">&amp;</span> <strong>Luca</strong></span>
      </h1>
      -->
      <h1 class="title">
        <span class="line">Quando a</span>
        <span class="line"><span class="ital">companhia</span></span>
        <span class="line">tiver gosto</span>
        <span class="line">de <span class="ital">lar,</span> <strong>Case.</strong></span>

      'DESCRIPTION:' + esc(title),
      'END:VEVENT',
      'END:VCALENDAR'
    ].map(fold).join('\r\n'); // RFC 5545 requires CRLF

    const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'casamento-betriz-luca-' + ev.label.toLowerCase().normalize('NFD').replace(/[^a-z]/g, '') + '.ics';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => renderTab(btn.dataset.tab));
  });

  renderTab('recepcao');

  // ---- Live countdown ----
  function updateCountdown() {
    const now = new Date();
    let diff = countdownTarget - now;
    const el = document.getElementById('countdown');
    if (diff <= 0) {
      el.textContent = 'Hoje é o grande dia!';
      return;
    }
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    diff -= days * (1000 * 60 * 60 * 24);
    const hours = Math.floor(diff / (1000 * 60 * 60));
    diff -= hours * (1000 * 60 * 60);
    const minutes = Math.floor(diff / (1000 * 60));
    diff -= minutes * (1000 * 60);
    const seconds = Math.floor(diff / 1000);
    el.textContent = `${days} ${days === 1 ? 'Dia' : 'Dias'}, ${hours}h, ${minutes}m ${seconds}s`;
  }

  updateCountdown();
  setInterval(updateCountdown, 1000); // ticks every second now that seconds show
</script>
</body>
</html>
